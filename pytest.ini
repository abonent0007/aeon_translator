[pytest]
testpaths = tests
addopts = --strict-markers -m "not network and not models and not gold_real"
markers =
    network: требует реальной сети / API-ключей (по умолчанию исключён)
    models: требует наличия ML-моделей на диске (по умолчанию исключён)
    gold_mock: gold-standard baseline на MockLLM (входит в дефолтный прогон)
    gold_real: gold-standard на реальном API (нужен DEEPSEEK_API_KEY; по умолчанию исключён)
