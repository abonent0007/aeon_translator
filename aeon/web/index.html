<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEON v3.0</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a14;--panel:#12121f;--border:#1e1e35;--purple:#a855f7;--purple-glow:#7c3aed;--purple-dim:#4c1d95;--accent:#c084fc;--text:#e2e8f0;--text-dim:#94a3b8;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--radius:10px;--font:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden;min-height:100vh}
canvas#neurons{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px}

/* lang switcher */
.lang-bar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:4px}
.lang-bar button{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;transition:all .2s}
.lang-bar button:hover{color:var(--text);border-color:var(--purple-dim)}
.lang-bar button.active{background:var(--purple-dim);color:#fff;border-color:var(--purple);font-weight:600}

.header{text-align:center;padding:20px 0 15px}
.header h1{font-size:2.2rem;font-weight:200;letter-spacing:6px;background:linear-gradient(135deg,var(--purple),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .sub{color:var(--text-dim);font-size:.85rem;letter-spacing:2px}
.header .status{display:flex;justify-content:center;gap:16px;margin-top:12px;flex-wrap:wrap}
.header .status span{font-size:.75rem;padding:3px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--border)}
.header .status .on{color:var(--green);border-color:#166534}
.header .status .off{color:var(--text-dim)}

.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{flex:1;min-width:55px;padding:10px 5px;background:var(--panel);border:1px solid var(--border);border-bottom:none;color:var(--text-dim);font-size:.78rem;cursor:pointer;transition:all .2s;border-radius:var(--radius) var(--radius) 0 0;letter-spacing:.3px;white-space:nowrap}
.tabs button:hover{color:var(--text);background:#1a1a2e}
.tabs button.active{background:var(--bg);color:var(--purple);border-color:var(--purple-dim);border-bottom:2px solid var(--purple);font-weight:600}
.panels{background:var(--panel);border:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);padding:24px;min-height:300px}
.panel{display:none}
.panel.active{display:block}
.input-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.input-row input,.input-row select,.input-row textarea{background:#0a0a18;border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:.9rem;font-family:var(--font);outline:none;transition:border .2s}
.input-row input:focus,.input-row textarea:focus{border-color:var(--purple)}
.input-row input{flex:1;min-width:150px}
.input-row select{min-width:100px}
.input-row textarea{width:100%;min-height:80px;resize:vertical}
.row-split{display:flex;gap:10px}
.row-split>*{flex:1}
.btn{background:linear-gradient(135deg,var(--purple-dim),var(--purple-glow));color:#fff;border:none;padding:10px 22px;border-radius:8px;font-size:.9rem;cursor:pointer;transition:all .25s;letter-spacing:.5px}
.btn:hover{box-shadow:0 0 20px rgba(124,58,237,.4);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn-sm{padding:6px 14px;font-size:.8rem}
.btn-outline{background:transparent;border:1px solid var(--purple);color:var(--purple)}
.btn-outline:hover{background:rgba(124,58,237,.15);box-shadow:none}
.btn-rec{background:var(--red)}
.btn-rec.active{animation:pulse-rec 1.5s infinite}
@keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}50%{box-shadow:0 0 0 12px rgba(248,113,113,0)}}
.output{background:#0a0a18;border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:14px;min-height:60px;max-height:400px;overflow-y:auto;font-family:'Cascadia Code','Fira Code',monospace;font-size:.85rem;white-space:pre-wrap;word-break:break-word;color:var(--text);line-height:1.5}
.output .success{color:var(--green)}
.output .error{color:var(--red)}
.bridge-result{display:flex;align-items:center;gap:20px;margin-top:14px;flex-wrap:wrap}
.bridge-bar{flex:1;min-width:200px;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.bridge-fill{height:100%;border-radius:4px;transition:width .6s ease}
.bridge-score{font-size:2rem;font-weight:200;color:var(--accent);min-width:60px;text-align:center}
.bridge-label{font-size:.75rem;color:var(--text-dim);text-align:center}
.img-preview{max-width:100%;border-radius:8px;border:1px solid var(--border);margin-top:8px}
.voice-box{border:1px solid var(--border);border-radius:8px;padding:16px}
.voice-box h4{color:var(--accent);margin-bottom:10px;font-weight:600}
.voice-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.record-status{font-size:.85rem;color:var(--text-dim)}
.audio-player{width:100%;margin-top:10px}
.axiom-card{background:#0a0a18;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:8px}
.axiom-card .name{color:var(--accent);font-weight:600;font-size:.9rem}
.axiom-card .stmt{color:var(--text-dim);margin-top:4px;font-size:.85rem;font-style:italic}
.log-toggle{position:fixed;bottom:20px;right:20px;z-index:100;width:44px;height:44px;border-radius:50%;background:var(--purple-glow);border:none;color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 0 20px rgba(124,58,237,.5)}
.log-panel{position:fixed;bottom:80px;right:20px;z-index:99;width:420px;max-height:55vh;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);display:none;flex-direction:column;overflow:hidden}
.log-panel.open{display:flex}
.log-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:.85rem}
.log-list{flex:1;overflow-y:auto;padding:8px;font-size:.75rem;font-family:monospace}
.log-item{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.log-time{color:var(--text-dim);min-width:56px}
.log-op{color:var(--purple);min-width:64px;font-weight:600}
.log-data{color:var(--text-dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-clear{color:var(--red);cursor:pointer;font-size:.75rem}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.tabs button{font-size:.65rem;padding:8px 2px}.log-panel{width:95vw;right:2.5vw}.header h1{font-size:1.5rem}}
</style>

<body>
<canvas id="neurons"></canvas>

<div class="app">
  <div class="lang-bar">
    <button data-lang="ru">🇷🇺 RU</button>

</div>

<button class="log-toggle" id="log-toggle">L</button>
<div class="log-panel" id="log-panel">

  <div class="log-list" id="log-list"></div>
</div>

<script>
// ═══════════════ NEURON CLOUD ═══════════════
(function(){
  var canvas = document.getElementById('neurons');
  var ctx = canvas.getContext('2d');
  var W, H, neurons = [];
  var mouse = {x: -1000, y: -1000};
  var N = 90;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for (var i = 0; i < N; i++) { neurons.push({x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-.5)*.4, vy: (Math.random()-.5)*.4, r: 2+Math.random()*3.5, pulse: Math.random()*Math.PI*2, speed: .3+Math.random()*.6}); }
  canvas.addEventListener('mousemove', function(e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  function draw() {
    ctx.clearRect(0,0,W,H);
    for (var i=0;i<N;i++) {
      var n=neurons[i]; n.x+=n.vx*n.speed; n.y+=n.vy*n.speed;
      if(n.x<0)n.x=W; if(n.x>W)n.x=0; if(n.y<0)n.y=H; if(n.y>H)n.y=0;
      var dx=mouse.x-n.x,dy=mouse.y-n.y,md=Math.sqrt(dx*dx+dy*dy);
      if(md<200){n.vx+=dx/md*.02;n.vy+=dy/md*.02}
      var spd=Math.sqrt(n.vx*n.vx+n.vy*n.vy); if(spd>1){n.vx/=spd;n.vy/=spd}
      for(var j=i+1;j<N;j++){var n2=neurons[j],d=Math.sqrt((n.x-n2.x)*(n.x-n2.x)+(n.y-n2.y)*(n.y-n2.y)); if(d<150){var a=(1-d/150)*.35; ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(n2.x,n2.y);ctx.strokeStyle='rgba(147,51,234,'+a+')';ctx.lineWidth=.5;ctx.stroke()}}
    }
    for(var k=0;k<N;k++){var nn=neurons[k];nn.pulse+=.02;var g=.6+Math.sin(nn.pulse)*.4;var grd=ctx.createRadialGradient(nn.x,nn.y,0,nn.x,nn.y,nn.r*4);grd.addColorStop(0,'rgba(192,132,252,'+g+')');grd.addColorStop(.5,'rgba(147,51,234,'+(g*.6)+')');grd.addColorStop(1,'rgba(76,29,149,0)');ctx.beginPath();ctx.arc(nn.x,nn.y,nn.r*4,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();ctx.beginPath();ctx.arc(nn.x,nn.y,nn.r,0,Math.PI*2);ctx.fillStyle='rgba(216,180,254,'+g+')';ctx.fill()}
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

var LANG = 'en';
function detectLang() {
  var nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('ru')) return 'ru';
  if (nav.startsWith('zh')) return 'zh';
  return 'en';
}

function setLang(lang) {
  LANG = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-bar button').forEach(function(b) {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  applyI18n();
}

function T(key) { return (I18N[LANG] && I18N[LANG][key]) || (I18N['en'][key]) || key; }

function applyI18n() {
  // data-i18n attributes
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.dataset.i18n;
    if (key === 'log_title') el.textContent = T('log_title');
    else if (key === 'log_clear') el.textContent = T('log_clear');
    else if (key === 'subtitle') el.textContent = T('subtitle');
  });

  // Generate tabs
  var tabsHtml = '';
  var tabKeys = ['translate','code','bridge','explain','voice','image','search','verify','viz','axioms'];
  var tabs = T('tabs');
  for (var i = 0; i < tabKeys.length; i++) {
    var cls = (i === 0) ? ' class="active"' : '';
    tabsHtml += '<button' + cls + ' data-tab="' + tabKeys[i] + '">' + tabs[i] + '</button>';
  }
  document.getElementById('tabs').innerHTML = tabsHtml;
  bindTabs();

  // Update all panel content
  buildPanels();
}

// ═══════════════ PANELS ═══════════════
function buildPanels() {
  var h = '';
  // TRANSLATE
  h += '<div class="panel active" id="panel-translate">';
  h += '<div class="input-row"><input id="tr-text" placeholder="'+T('tr_placeholder')+'"><select id="tr-from"><option value="auto">Auto</option><option value="russian">RU</option><option value="english" selected>EN</option><option value="chinese">ZH</option><option value="japanese">JA</option><option value="german">DE</option><option value="french">FR</option><option value="spanish">ES</option></select><span style="color:var(--text-dim);align-self:center">→</span><select id="tr-to"><option value="russian">RU</option><option value="english" selected>EN</option><option value="chinese">ZH</option><option value="japanese">JA</option><option value="german">DE</option><option value="french">FR</option><option value="spanish">ES</option></select><button class="btn" id="btn-translate">'+T('btn_translate')+'</button></div>';
  h += '<div class="output" id="tr-out"></div></div>';

  // CODE
  h += '<div class="panel" id="panel-code">';
  h += '<div class="input-row"><input id="code-text" placeholder="'+T('code_placeholder')+'"><select id="code-lang"><option value="python">Python</option><option value="javascript">JavaScript</option></select><button class="btn" id="btn-code">'+T('btn_code')+'</button></div>';
  h += '<div class="output" id="code-out"></div></div>';

  // BRIDGE
  h += '<div class="panel" id="panel-bridge">';
  h += '<div class="row-split" style="margin-bottom:14px"><textarea id="br-a" placeholder="'+T('br_placeholder_a')+'"></textarea><textarea id="br-b" placeholder="'+T('br_placeholder_b')+'"></textarea></div>';
  h += '<div style="text-align:center"><button class="btn" id="btn-bridge">'+T('btn_bridge')+'</button></div>';
  h += '<div class="output" id="br-out"></div></div>';

  // EXPLAIN
  h += '<div class="panel" id="panel-explain">';
  h += '<div class="input-row"><input id="ex-text" placeholder="'+T('ex_placeholder')+'"><button class="btn" id="btn-explain">'+T('btn_explain')+'</button><button class="btn btn-outline btn-sm" id="btn-save">'+T('btn_save')+'</button></div>';
  h += '<div class="output" id="ex-out"></div></div>';

  // VOICE
  h += '<div class="panel" id="panel-voice">';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';
  h += '<div class="voice-box"><h4>'+T('stt_title')+'</h4><div class="voice-controls"><button class="btn" id="btn-record">'+T('btn_record')+'</button><select id="vc-lang" style="background:#0a0a18;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:.8rem"><option value="auto">Auto</option><option value="russian">RU</option><option value="english">EN</option><option value="chinese">ZH</option></select><span class="record-status" id="rec-status"></span></div><div class="output" id="stt-out" style="min-height:40px;margin-top:8px"></div></div>';
  h += '<div class="voice-box"><h4>'+T('tts_title')+'</h4><div class="input-row"><input id="tts-text" placeholder="'+T('tts_placeholder')+'"><select id="tts-lang" style="background:#0a0a18;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:.8rem"><option value="russian">RU</option><option value="english" selected>EN</option><option value="chinese">ZH</option></select></div><button class="btn" id="btn-speak">'+T('btn_speak')+'</button><audio class="audio-player" id="tts-audio" controls style="margin-top:10px;display:none"></audio></div>';
  h += '</div></div>';

  // IMAGE
  h += '<div class="panel" id="panel-image">';
  h += '<div class="input-row"><input id="img-text" placeholder="'+T('img_placeholder')+'"><select id="img-style" style="background:#0a0a18;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:.8rem"><option value="realistic">Realistic</option><option value="cyberpunk">Cyberpunk</option><option value="artistic">Artistic</option><option value="ethereal">Ethereal</option><option value="futuristic">Futuristic</option></select><button class="btn" id="btn-image">'+T('btn_image')+'</button></div>';
  h += '<div class="output" id="img-out"></div></div>';

  // SEARCH
  h += '<div class="panel" id="panel-search">';
  h += '<div class="input-row"><input id="sr-query" placeholder="'+T('sr_placeholder')+'"></div>';
  h += '<div class="input-row"><input id="sr-c1" placeholder="'+T('sr_candidate')+' 1"><input id="sr-c2" placeholder="'+T('sr_candidate')+' 2"><input id="sr-c3" placeholder="'+T('sr_candidate')+' 3"><input id="sr-c4" placeholder="'+T('sr_candidate')+' 4"></div>';
  h += '<button class="btn" id="btn-search">'+T('btn_search')+'</button><div class="output" id="sr-out"></div></div>';

  // VERIFY
  h += '<div class="panel" id="panel-verify">';
  h += '<div class="input-row"><input id="vf-text" placeholder="'+T('vf_placeholder')+'"><button class="btn" id="btn-verify">'+T('btn_verify')+'</button></div>';
  h += '<div class="output" id="vf-out"></div></div>';

  // VIZ
  h += '<div class="panel" id="panel-viz">';
  h += '<div class="input-row"><input id="viz-text" placeholder="'+T('viz_placeholder')+'"><button class="btn" id="btn-viz">'+T('btn_viz')+'</button></div>';
  h += '<div class="output" id="viz-out"></div></div>';

  // AXIOMS
  h += '<div class="panel" id="panel-axioms"><div id="axioms-out"></div></div>';

  document.querySelector('.panels').innerHTML = h;
  bindAllButtons();
}

// ═══════════════ TAB BINDING ═══════════════
function bindTabs() {
  document.querySelectorAll('#tabs button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#tabs button').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      var panel = document.getElementById('panel-' + btn.dataset.tab);
      if (panel) panel.classList.add('active');
      if (btn.dataset.tab === 'axioms') loadAxioms();
    });
  });
}

// ═══════════════ HELPERS ═══════════════
function setOut(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }
function getVal(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
async function apiPost(url, body) { var r = await fetch(url, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); return r.json(); }

// ═══════════════ LOG ═══════════════
var logOpen = false, logBuffer = [];
document.getElementById('log-toggle').addEventListener('click', function() { logOpen = !logOpen; document.getElementById('log-panel').classList.toggle('open', logOpen); if (logOpen) fetchLogs(); });
document.getElementById('log-clear').addEventListener('click', function() { logBuffer = []; document.getElementById('log-list').innerHTML = ''; });
async function fetchLogs() { try { var r = await fetch('/api/logs'); var d = await r.json(); logBuffer = d.logs || []; renderLogs(); } catch(e) {} }
function addLog(op, data) { var t = new Date().toTimeString().slice(0,8); logBuffer.push({time:t, op:op, data:data}); if (logBuffer.length>200) logBuffer=logBuffer.slice(-200); if (logOpen) renderLogs(); }
function renderLogs() { var el = document.getElementById('log-list'); if (!logBuffer.length) { el.innerHTML = ''; return; } var h = ''; var items = logBuffer.slice(-60).reverse(); for (var i=0;i<items.length;i++) { var l=items[i]; h += '<div class="log-item"><span class="log-time">'+l.time+'</span><span class="log-op">'+l.op+'</span><span class="log-data">'+JSON.stringify(l.data).slice(0,100)+'</span></div>'; } el.innerHTML = h; }

// ═══════════════ BUTTON BINDING ═══════════════
function bindAllButtons() {
  // Translate
  document.getElementById('btn-translate').addEventListener('click', async function() {
    var text = getVal('tr-text'); if (!text) return;
    setOut('tr-out', '<span class="spinner"></span> '+T('translating'));
    try { var d = await apiPost('/api/translate',{text:text,source_lang:document.getElementById('tr-from').value,target_lang:document.getElementById('tr-to').value}); setOut('tr-out','<div class="success">'+d.result+'</div>'); addLog('translate',{text:text.slice(0,40),result:d.result.slice(0,40)}); } catch(e) { setOut('tr-out','<span class="error">'+e.message+'</span>'); }
  });

  // Code
  document.getElementById('btn-code').addEventListener('click', async function() {
    var text = getVal('code-text'); if (!text) return;
    setOut('code-out', '<span class="spinner"></span> '+T('generating'));
    try { var d = await apiPost('/api/code',{text:text,language:document.getElementById('code-lang').value}); setOut('code-out',d.result); addLog('code',{lang:document.getElementById('code-lang').value,text:text.slice(0,40)}); } catch(e) { setOut('code-out','<span class="error">'+e.message+'</span>'); }
  });

  // Bridge
  document.getElementById('btn-bridge').addEventListener('click', async function() {
    var a = getVal('br-a'), b = getVal('br-b'); if (!a||!b) return;
    setOut('br-out', '<span class="spinner"></span> '+T('bridging'));
    try { var d = await apiPost('/api/bridge',{text_a:a,text_b:b}); var simPct=(d.similarity*100).toFixed(0); var barColor=d.connected?'var(--green)':(d.similarity>0.4?'var(--yellow)':'var(--red)'); var icon=d.connected?T('connected'):T('not_connected'); var color=d.connected?'var(--green)':'var(--red)'; setOut('br-out','<div class="bridge-result"><div class="bridge-score">'+simPct+'%</div><div style="flex:1"><div class="bridge-bar"><div class="bridge-fill" style="width:'+simPct+'%;background:'+barColor+'"></div></div><div class="bridge-label" style="margin-top:6px">'+T('similarity')+'</div></div></div><div style="margin-top:10px;font-size:.85rem"><span style="color:'+color+'">'+icon+'</span> <span style="color:var(--text-dim)">'+d.message+'</span></div><div style="margin-top:6px;font-size:.75rem;color:var(--text-dim)">'+(d.methods||[]).join(', ')+'</div>'+(d.explanation?'<div style="margin-top:6px;font-size:.8rem;color:var(--text-dim)">'+d.explanation+'</div>':'')); addLog('bridge',{sim:simPct,connected:d.connected}); } catch(e) { setOut('br-out','<span class="error">'+e.message+'</span>'); }
  });

  // Explain
  document.getElementById('btn-explain').addEventListener('click', async function() {
    var text = getVal('ex-text'); if (!text) return;
    setOut('ex-out', '<span class="spinner"></span> '+T('analyzing'));
    try { var d = await apiPost('/api/explain',{text:text,source_lang:'auto',target_lang:'english'}); var h='<div><b>Intent:</b> '+d.intent+' | <b>Domain:</b> '+d.domain+' | <b>Embedding:</b> '+d.embedding_dim+'D</div>'; if(d.entities&&d.entities.length){h+='<div style="margin-top:10px"><b>'+T('entities')+':</b>';for(var i=0;i<d.entities.length;i++)h+='<br>&nbsp;&nbsp;- <b>'+d.entities[i].name+'</b> ['+d.entities[i].type+'] '+d.entities[i].role;h+='</div>'} if(d.explanation&&d.explanation.length){h+='<div style="margin-top:10px"><b>'+T('reasoning')+':</b>';for(var j=0;j<d.explanation.length;j++)h+='<br>&nbsp;&nbsp;'+(j+1)+'. '+d.explanation[j];h+='</div>'} setOut('ex-out',h); addLog('explain',{intent:d.intent,entities:d.entities?d.entities.length:0}); } catch(e) { setOut('ex-out','<span class="error">'+e.message+'</span>'); }
  });

  // Save .aeon
  document.getElementById('btn-save').addEventListener('click', async function() {
    var text = getVal('ex-text'); if (!text) return;
    try { var r = await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,path:'output.aeon'})}); if(r.ok){var blob=await r.blob();var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='output.aeon';a.click();addLog('save',{text:text.slice(0,40)})} } catch(e) {}
  });

  // Search
  document.getElementById('btn-search').addEventListener('click', async function() {
    var query=getVal('sr-query'),cands=[];for(var i=1;i<=4;i++){var v=getVal('sr-c'+i);if(v)cands.push(v)} if(!query||!cands.length)return;
    setOut('sr-out','<span class="spinner"></span> '+T('searching'));
    try { var d=await apiPost('/api/search',{query:query,candidates:cands});var h='';for(var j=0;j<d.results.length;j++)h+='<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)"><span>'+(j+1)+'. '+d.results[j].text+'</span><span style="color:var(--accent)">'+d.results[j].score.toFixed(4)+'</span></div>';setOut('sr-out',h);addLog('search',{query:query.slice(0,40),hits:d.results.length}); } catch(e) { setOut('sr-out','<span class="error">'+e.message+'</span>'); }
  });

  // Verify
  document.getElementById('btn-verify').addEventListener('click', async function() {
    var text=getVal('vf-text');if(!text)return;
    setOut('vf-out','<span class="spinner"></span> '+T('verifying'));
    try { var d=await apiPost('/api/verify',{text:text,source_lang:'auto'});var rc=d.risk<0.2?'var(--green)':(d.risk<0.4?'var(--yellow)':'var(--red)');setOut('vf-out','<div><b>'+T('verdict')+':</b> <span style="color:'+rc+'">'+d.verdict+'</span></div><div><b>'+T('hallucination_risk')+':</b> <span style="color:'+rc+';font-size:1.2rem">'+(d.risk*100).toFixed(1)+'%</span></div><div><b>'+T('consistency')+':</b> '+(d.consistency*100).toFixed(0)+'%</div>');addLog('verify',{risk:(d.risk*100).toFixed(0)+'%',verdict:d.verdict}); } catch(e) { setOut('vf-out','<span class="error">'+e.message+'</span>'); }
  });

  // Viz
  document.getElementById('btn-viz').addEventListener('click', async function() {
    var text=getVal('viz-text');if(!text)return;
    setOut('viz-out','<span class="spinner"></span> '+T('visualizing'));
    try { var d=await apiPost('/api/viz',{text:text,source_lang:'auto',target_lang:'english'});setOut('viz-out',d.visualization);addLog('viz',{text:text.slice(0,40)}); } catch(e) { setOut('viz-out','<span class="error">'+e.message+'</span>'); }
  });

  // Voice: Record
  var mediaRecorder=null,audioChunks=[],isRecording=false;
  document.getElementById('btn-record').addEventListener('click', async function() {
    if(isRecording){mediaRecorder.stop();return}
    try{var stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=function(e){audioChunks.push(e.data)};mediaRecorder.onstop=async function(){stream.getTracks().forEach(function(t){t.stop()});document.getElementById('btn-record').textContent=T('btn_record');document.getElementById('btn-record').classList.remove('active');document.getElementById('rec-status').textContent=T('transcribing');var blob=new Blob(audioChunks,{type:'audio/webm'});var form=new FormData();form.append('file',blob,'recording.webm');form.append('language',document.getElementById('vc-lang').value);try{var r=await fetch('/api/voice/transcribe',{method:'POST',body:form});if(!r.ok){setOut('stt-out','<span class="error">'+T('whisper_na')+'</span>');document.getElementById('rec-status').textContent='';return}var d=await r.json();setOut('stt-out','<div class="success">'+d.text+'</div><div style="font-size:.75rem;color:var(--text-dim);margin-top:4px">'+T('language')+': '+d.language+'</div>');addLog('stt',{lang:d.language,text:d.text.slice(0,40)})}catch(e){setOut('stt-out','<span class="error">'+e.message+'</span>')}document.getElementById('rec-status').textContent='';isRecording=false};mediaRecorder.start();isRecording=true;document.getElementById('btn-record').textContent=T('btn_stop');document.getElementById('btn-record').classList.add('active');document.getElementById('rec-status').textContent=T('rec_status')}catch(e){setOut('stt-out','<span class="error">'+T('mic_denied')+'</span>')}
  });

  // Voice: Speak
  document.getElementById('btn-speak').addEventListener('click', async function() {
    var text=getVal('tts-text');if(!text)return;var lang=document.getElementById('tts-lang').value;
    try{var r=await fetch('/api/voice/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,language:lang})});if(!r.ok){return}var blob=await r.blob();var url=URL.createObjectURL(blob);var audio=document.getElementById('tts-audio');audio.src=url;audio.style.display='block';audio.play();addLog('tts',{lang:lang,text:text.slice(0,40)})}catch(e){}
  });

  // Image
  document.getElementById('btn-image').addEventListener('click', async function() {
    var text=getVal('img-text');if(!text)return;var style=document.getElementById('img-style').value;
    setOut('img-out','<span class="spinner"></span> '+T('img_generating'));
    try{var d=await apiPost('/api/image',{text:text,style:style});if(d.error){setOut('img-out','<span class="error">'+d.error+'</span>');return}var h='';if(d.urls&&d.urls.length){for(var i=0;i<d.urls.length;i++)h+='<img src="'+d.urls[i]+'" class="img-preview" onerror="this.style.display=\'none\'">'}if(!h)h='<span class="success">'+T('saved')+'</span>';setOut('img-out',h);addLog('image',{style:style,text:text.slice(0,40)})}catch(e){setOut('img-out','<span class="error">'+e.message+'</span>')}
  });
}

// ═══════════════ AXIOMS ═══════════════
function loadAxioms() {
  var el = document.getElementById('axioms-out');
  if (el.innerHTML) return;
  fetch('/api/axioms').then(function(r){return r.json()}).then(function(d){
    var h = '';
    for (var i = 0; i < d.axioms.length; i++) { h += '<div class="axiom-card"><div class="name">' + d.axioms[i].name + '</div><div class="stmt">' + d.axioms[i].statement + '</div></div>'; }
    el.innerHTML = h;
  }).catch(function(){});
}

// ═══════════════ STATUS ═══════════════
async function loadStatus() {
  try { var r = await fetch('/api/stats'); var d = await r.json(); var m = d.modules || {}; var h = ''; for (var k in m) { if (k === 'aeon_format') continue; h += '<span class="'+(m[k]?'on':'off')+'">'+k+': '+(m[k]?'ON':'OFF')+'</span>'; } document.getElementById('status').innerHTML = h; } catch(e) { document.getElementById('status').innerHTML = '<span class="off">'+T('server_offline')+'</span>'; }
}

// ═══════════════ ENTER KEY ═══════════════
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter' || e.target.tagName === 'TEXTAREA') return;
  var active = document.querySelector('.panel.active'); if (!active) return;
  var map = {'panel-translate':'btn-translate','panel-code':'btn-code','panel-bridge':'btn-bridge','panel-explain':'btn-explain','panel-search':'btn-search','panel-verify':'btn-verify','panel-viz':'btn-viz'};
  var btnId = map[active.id]; if (btnId) document.getElementById(btnId).click();
});

// ═══════════════ INIT ═══════════════
// Language switcher
document.querySelectorAll('.lang-bar button').forEach(function(btn) {
  btn.addEventListener('click', function() { setLang(btn.dataset.lang); });
});

// Detect system language and start
setLang(detectLang());
loadStatus();
</script>
</body>
